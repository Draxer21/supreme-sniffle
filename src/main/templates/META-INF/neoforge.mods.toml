license="${mod_license}"

[[mods]]
modId="ascension"
version="1.4.0"
displayName="Ascension Table"
authors="Draxer"
description='''
Mesa de Ascension: mejora encantamientos hasta nivel XV usando materiales con valor en puntos.
'''
[[dependencies.ascension]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.ascension]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

