name: Compilar Drax Pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v5
        with:
          name: drax-pack
          path: build/libs/*.jar
          if-no-files-found: error

      # Guarda el .jar en la rama "builds" (solo los push a main), para descargarlo fácil desde GitHub.
      - name: Publicar en la rama builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          mkdir -p /tmp/out && cp "$JAR" /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds-tmp
          git rm -rfq .
          cp /tmp/out/*.jar .
          printf '# Último build de Drax Pack\n\nCommit: %s\n' "$GITHUB_SHA" > README.md
          git add *.jar README.md
          git commit -qm "Build de $GITHUB_SHA"
          git push -f origin builds-tmp:builds
